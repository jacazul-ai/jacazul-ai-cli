[project]
name = "jacazul-ai-cli"
version = "0.5.0"
description = "High-integrity AI CLI environment with Taskwarrior and Git integration"
authors = [{ name = "Flavio Garcia", email = "piraz@candango.org" }]
dependencies = [
    "orjson>=3.10.0",
    "tornado>=6.4.0",
    "ruff>=0.4.0",
    "pycodestyle>=2.11.0",
]
requires-python = ">=3.13"

[project.scripts]
tw-flow = "jacazul.cli.flow:main"
taskp = "jacazul.cli.taskp:main"
ponder = "jacazul.cli.ponder:main"
jacazul-hatch = "jacazul.cli.hatch:main"
jacazul-persona = "jacazul.cli.persona:main"
jacazul-github = "jacazul.cli.github:main"
jacazul-broker = "jacazul.cli.broker:main"
py-check = "jacazul.cli.pycheck:main"
py-mode = "jacazul.cli.pymode:main"
js-mode = "jacazul.cli.jsmode:main"
js-check = "jacazul.cli.jscheck:main"
zig-era = "jacazul.cli.zigera:main"
php-mode = "jacazul.cli.phpmode:main"
php-census = "jacazul.cli.phpcensus:main"
sh-mode = "jacazul.cli.shmode:main"
sh-census = "jacazul.cli.shcensus:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jacazul"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
