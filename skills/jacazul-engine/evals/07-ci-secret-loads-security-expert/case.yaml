schema_version: "1.0"
name: 07-ci-secret-loads-security-expert
description: >-
  A CI secrets question loads security-expert on demand, and git-expert
  stays unloaded.
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    Our GitHub Actions workflow runs on pull_request_target, checks out the
    PR head and runs `npm install` with a deploy token in the environment.
    Is that fine? Answer briefly.
graders:
  - name: security-expert-loaded
    type: tool_used
    tool: Skill
    input_match: security-expert
    arm: both
  - name: git-expert-not-loaded
    type: tool_used
    tool: Skill
    input_match: git-expert
    min: 0
    max: 0
    arm: both
  - name: names-the-risk
    type: llm
    criteria: |
      - The reply says the setup is unsafe because untrusted pull request
        code runs with access to the deploy token.
      - The reply gives a concrete fix, such as not checking out the PR
        head under pull_request_target or moving the secret to a separate
        trusted workflow.
