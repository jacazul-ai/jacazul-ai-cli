schema_version: "1.0"
name: 06-commit-loads-git-expert
description: >-
  A commit request loads git-expert on demand, and unrelated experts stay
  unloaded.
execution:
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Skill, Bash, Read, Glob, Grep]
  prompt: |
    I fixed a typo in README.md. Commit it with a proper message.
graders:
  - name: git-expert-loaded
    type: tool_used
    tool: Skill
    input_match: git-expert
    arm: both
  - name: security-expert-not-loaded
    type: tool_used
    tool: Skill
    input_match: security-expert
    min: 0
    max: 0
    arm: both
